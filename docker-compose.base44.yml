services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: delta
      POSTGRES_PASSWORD: delta
      POSTGRES_DB: delta
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delta"]
      interval: 5s
      timeout: 5s
      retries: 10

  setup:
    image: node:22
    working_dir: /app
    volumes:
      - ./you-are-working-on-delta:/app
    environment:
      - DATABASE_URL=postgres://delta:delta@db:5432/delta
    command: sh -c "npm i -g pnpm@9 && pnpm install --frozen-lockfile && pnpm --filter @workspace/db run push"
    depends_on:
      db:
        condition: service_healthy

  api:
    image: node:22
    working_dir: /app
    volumes:
      - ./you-are-working-on-delta:/app
    environment:
      - NODE_ENV=development
      - PORT=3100
      - DATABASE_URL=postgres://delta:delta@db:5432/delta
    command: sh -c "npm i -g pnpm@9 && pnpm --filter @workspace/api-server run dev"
    depends_on:
      setup:
        condition: service_completed_successfully

  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./you-are-working-on-delta:/app
    environment:
      - NODE_ENV=development
      - PORT=5173
      - API_PROXY_URL=http://api:3100
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "npm i -g pnpm@9 && pnpm --filter @workspace/delta-platform run dev"
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "3000:5173"
