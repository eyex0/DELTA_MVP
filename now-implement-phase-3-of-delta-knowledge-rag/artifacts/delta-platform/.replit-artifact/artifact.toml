kind = "web"
previewPath = "/"
title = "DELTA Implementation Platform"
description = "A production-quality DELTA web app combining a public AI implementation platform narrative with a focused operational MVP for discovery, requirements, analysis, human approval, implementation planning, and traceability."
version = "1.0.0"
id = "artifacts/delta-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23855

[services.development]
run = "pnpm --filter @workspace/delta-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/delta-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/delta-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23855"
BASE_PATH = "/"
