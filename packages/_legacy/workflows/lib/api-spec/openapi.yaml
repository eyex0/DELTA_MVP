openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DELTA implementation workflow API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: projects
  - name: discovery
  - name: requirements
  - name: analysis
  - name: approvals
  - name: planning
  - name: activity
  - name: traceability
  - name: workflows
paths:
  /workflows:
    get:
      operationId: listWorkflows
      tags: [workflows]
      responses:
        "200":
          description: Workflow definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workflow"
    post:
      operationId: createWorkflow
      tags: [workflows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowInput"
      responses:
        "201":
          description: Workflow created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
  /workflows/{workflowId}/runs:
    post:
      operationId: startWorkflow
      tags: [workflows]
      parameters:
        - in: path
          name: workflowId
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Workflow run queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
  /workflow-runs/{runId}:
    get:
      operationId: getWorkflowRun
      tags: [workflows]
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workflow run state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
  /workflow-runs/{runId}/pause:
    post:
      operationId: pauseWorkflowRun
      tags: [workflows]
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workflow paused
  /workflow-runs/{runId}/resume:
    post:
      operationId: resumeWorkflowRun
      tags: [workflows]
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workflow resumed
  /workflow-runs/{runId}/approval:
    post:
      operationId: decideWorkflowApproval
      tags: [workflows]
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approval decision recorded
  /workflow-webhooks/{workflowId}:
    post:
      operationId: triggerWorkflowWebhook
      tags: [workflows]
      parameters:
        - in: path
          name: workflowId
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Workflow triggered from webhook
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get operational dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List implementation projects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create an implementation project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update project metadata
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}/discovery/run:
    post:
      operationId: runDiscovery
      tags: [discovery]
      summary: Run the Discovery Agent
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoveryInput"
      responses:
        "200":
          description: Discovery result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResult"
  /projects/{projectId}/requirements:
    get:
      operationId: listRequirements
      tags: [requirements]
      summary: List project requirements
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Requirements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Requirement"
  /requirements/{requirementId}:
    patch:
      operationId: updateRequirement
      tags: [requirements]
      summary: Update a requirement
      parameters:
        - $ref: "#/components/parameters/RequirementId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementUpdate"
      responses:
        "200":
          description: Updated requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
  /projects/{projectId}/analysis:
    get:
      operationId: getAnalysis
      tags: [analysis]
      summary: Get analysis output
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
    post:
      operationId: runAnalysis
      tags: [analysis]
      summary: Run the Analysis Agent
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Analysis output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
  /projects/{projectId}/approvals:
    get:
      operationId: listApprovals
      tags: [approvals]
      summary: List project approvals
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Approvals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Approval"
  /approvals/{approvalId}/decision:
    post:
      operationId: decideApproval
      tags: [approvals]
      summary: Record a human approval decision
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecision"
      responses:
        "200":
          description: Updated approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
  /projects/{projectId}/implementation-plan:
    get:
      operationId: getImplementationPlan
      tags: [planning]
      summary: Get implementation plan
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Implementation plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImplementationPlan"
    post:
      operationId: generateImplementationPlan
      tags: [planning]
      summary: Generate implementation plan
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Implementation plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImplementationPlan"
  /projects/{projectId}/activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: Get project activity timeline
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"
  /projects/{projectId}/traceability:
    get:
      operationId: getTraceability
      tags: [traceability]
      summary: Get requirement-to-outcome traceability
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Traceability
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TraceabilityLink"
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    RequirementId:
      name: requirementId
      in: path
      required: true
      schema: { type: string }
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema: { type: string }
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]
    Project:
      type: object
      required: [id, name, description, industry, objective, status, lifecycleStage, progress, requirementsCount, openDecisions, risks, pendingApprovals, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        industry: { type: string }
        objective: { type: string }
        status: { type: string }
        lifecycleStage: { type: string }
        progress: { type: integer }
        requirementsCount: { type: integer }
        openDecisions: { type: integer }
        risks: { type: integer }
        pendingApprovals: { type: integer }
        updatedAt: { type: string }
    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [owner, createdAt]
          properties:
            owner: { type: string }
            createdAt: { type: string }
    ProjectInput:
      type: object
      required: [name, description, industry, objective]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        industry: { type: string }
        objective: { type: string }
    ProjectUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        objective: { type: string }
        lifecycleStage: { type: string }
    DiscoveryInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1 }
        sourceType: { type: string }
    DiscoveryResult:
      type: object
      required: [runId, status, summary, objectives, stakeholders, assumptions, openQuestions, risks, requirementsCreated, completedAt]
      properties:
        runId: { type: string }
        status: { type: string }
        summary: { type: string }
        objectives:
          type: array
          items: { type: string }
        stakeholders:
          type: array
          items: { type: string }
        assumptions:
          type: array
          items: { type: string }
        openQuestions:
          type: array
          items: { type: string }
        risks:
          type: array
          items: { type: string }
        requirementsCreated: { type: integer }
        completedAt: { type: string }
    Requirement:
      type: object
      required: [id, projectId, title, description, source, priority, status, owner, confidence, dependencies, linkedProcess, linkedDecision, linkedOutput]
      properties:
        id: { type: string }
        projectId: { type: string }
        title: { type: string }
        description: { type: string }
        source: { type: string }
        priority: { type: string }
        status: { type: string }
        owner: { type: string }
        confidence: { type: integer }
        dependencies:
          type: array
          items: { type: string }
        linkedProcess: { type: string }
        linkedDecision: { type: string }
        linkedOutput: { type: string }
    RequirementUpdate:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        priority: { type: string }
        status: { type: string }
    Analysis:
      type: object
      required: [id, projectId, status, requirementsAnalyzed, validated, ambiguous, conflicts, missingDependencies, risks, recommendations, openDecisions, completedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        status: { type: string }
        requirementsAnalyzed: { type: integer }
        validated: { type: integer }
        ambiguous: { type: integer }
        conflicts: { type: integer }
        missingDependencies: { type: integer }
        risks:
          type: array
          items: { type: string }
        recommendations:
          type: array
          items: { type: string }
        openDecisions:
          type: array
          items: { type: string }
        completedAt: { type: string }
    Approval:
      type: object
      required: [id, projectId, title, description, source, status, requestedAt, decisionBy, comment]
      properties:
        id: { type: string }
        projectId: { type: string }
        title: { type: string }
        description: { type: string }
        source: { type: string }
        status: { type: string }
        requestedAt: { type: string }
        decidedAt: { type: ["string", "null"] }
        decisionBy: { type: string }
        comment: { type: string }
    ApprovalDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, changes_requested, rejected, escalated]
        comment: { type: string }
    ImplementationTask:
      type: object
      required: [id, title, workstream, owner, status, priority, dependencies, sequence, linkedRequirements]
      properties:
        id: { type: string }
        title: { type: string }
        workstream: { type: string }
        owner: { type: string }
        status: { type: string }
        priority: { type: string }
        dependencies:
          type: array
          items: { type: string }
        sequence: { type: integer }
        linkedRequirements:
          type: array
          items: { type: string }
    ImplementationPlan:
      type: object
      required: [id, projectId, status, summary, tasks, generatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        status: { type: string }
        summary: { type: string }
        generatedAt: { type: string }
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/ImplementationTask"
    ActivityEvent:
      type: object
      required: [id, projectId, timestamp, actor, title, detail, type]
      properties:
        id: { type: string }
        projectId: { type: string }
        timestamp: { type: string }
        actor: { type: string }
        title: { type: string }
        detail: { type: string }
        type: { type: string }
    TraceabilityLink:
      type: object
      required: [objective, source, requirement, analysis, decision, task, outcome]
      properties:
        objective: { type: string }
        source: { type: string }
        requirement: { type: string }
        analysis: { type: string }
        decision: { type: string }
        task: { type: string }
        outcome: { type: string }
    WorkflowStep:
      type: object
      required: [id, type]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [AI, TOOL, CONDITION, TRANSFORM, WAIT, APPROVAL, WEBHOOK, NOTIFICATION, LOOP]
        name: { type: string }
        input: { type: object, additionalProperties: true }
        tool: { type: string }
        condition: { type: object, additionalProperties: true }
        waitMs: { type: integer }
    WorkflowInput:
      type: object
      required: [name, triggerType, steps]
      properties:
        name: { type: string }
        description: { type: string }
        triggerType:
          type: string
          enum: [manual, ai, scheduled, event, webhook]
        workspaceId: { type: string }
        organizationId: { type: string }
        enabled: { type: boolean }
        scheduleAt: { type: string, format: date-time }
        webhookSecret: { type: string }
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStep"
    Workflow:
      type: object
      required: [id, organizationId, name, triggerType, steps]
      properties:
        id: { type: string }
        workflowId: { type: string }
        organizationId: { type: string }
        workspaceId: { type: string }
        name: { type: string }
        description: { type: string }
        triggerType: { type: string }
        enabled: { type: boolean }
        scheduleAt: { type: ["string", "null"], format: date-time }
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStep"
        webhookSecret: { type: ["string", "null"] }
    WorkflowRun:
      type: object
      required: [id, workflowId, organizationId, status, currentStep, input, stepResults, errors]
      properties:
        id: { type: string }
        workflowRunId: { type: string }
        workflowId: { type: string }
        organizationId: { type: string }
        workspaceId: { type: string }
        startedBy: { type: ["string", "null"] }
        currentStep: { type: integer }
        status:
          type: string
          enum: [QUEUED, RUNNING, WAITING, WAITING_FOR_APPROVAL, PAUSED, COMPLETED, FAILED, CANCELLED]
        input: { type: object, additionalProperties: true }
        stepResults:
          type: array
          items:
            type: object
            additionalProperties: true
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
        approvalState: { type: ["object", "null"], additionalProperties: true }
        retryState: { type: object, additionalProperties: true }
        finalResult: { type: ["object", "null"], additionalProperties: true }
        startedAt: { type: ["string", "null"], format: date-time }
        updatedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
    Dashboard:
      type: object
      required: [activeProjects, agentsWorking, pendingApprovals, requirements, risks, decisions, completionRate, recentActivity, projects]
      properties:
        activeProjects: { type: integer }
        agentsWorking: { type: integer }
        pendingApprovals: { type: integer }
        requirements: { type: integer }
        risks: { type: integer }
        decisions: { type: integer }
        completionRate: { type: integer }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEvent"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"